# Substrike for macOS: CLAP, VST3 and Audio Unit, universal (Apple Silicon and
# Intel), macOS 10.15 or later.
#
# Built here because it cannot be built on the development machine: the
# macOS SDK may only be used on Apple hardware, and GitHub's macOS runners are
# that hardware. The bundles are signed ad hoc, not notarized; INSTALL.txt in
# the archive explains the one command that clears the quarantine.
#
# Every run uploads Substrike-<version>-macOS.zip as a workflow artifact. When a
# GitHub release tagged substrike-v* is published, the archive is also attached
# to that release.

name: Substrike macOS

on:
  push:
    branches: [main]
    paths:
      - "substrike/**"
      - "shared/cmake/build-macos-cairo.sh"
      - "shared/patches/**"
      - ".github/workflows/substrike-macos.yml"
  pull_request:
    paths:
      - "substrike/**"
      - "shared/cmake/build-macos-cairo.sh"
      - "shared/patches/**"
      - ".github/workflows/substrike-macos.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: substrike-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'substrike-v')
    runs-on: macos-15
    permissions:
      contents: write # attaching the archive to a release
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4

      - name: Build tools
        run: brew install meson ninja pkgconf

      # CLAP/ is gitignored (third-party SDKs, see CLAUDE.md): the same
      # versions the Linux and Windows builds use, plus Apple's AudioUnitSDK.
      - name: SDKs
        run: |
          mkdir -p CLAP && cd CLAP
          git clone --depth 1 --branch 1.2.10 https://github.com/free-audio/clap.git
          git clone --depth 1 --branch v0.16.0 https://github.com/free-audio/clap-wrapper.git
          git clone --depth 1 --branch v3.8.1_build_84 https://github.com/steinbergmedia/vst3sdk.git
          git -C vst3sdk submodule update --init base pluginterfaces public.sdk
          git clone --depth 1 --branch AudioUnitSDK-1.1.0 https://github.com/apple/AudioUnitSDK.git
          git -C clap-wrapper apply ../../shared/patches/clap-wrapper-vst3-sdk-3.8.patch
          git -C clap-wrapper apply ../../shared/patches/clap-wrapper-auv2-main-bus-channels.patch

      # Restored and saved in two steps, so a Cairo that was built is kept
      # even when a later step fails. The key is shared with the other
      # plugins' workflows.
      - name: Cairo cache
        id: cairo
        uses: actions/cache/restore@v4
        with:
          path: |
            macbuild/cairo-macos/include
            macbuild/cairo-macos/lib
          key: cairo-macos-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('shared/cmake/build-macos-cairo.sh') }}

      - name: Cairo
        if: steps.cairo.outputs.cache-hit != 'true'
        run: shared/cmake/build-macos-cairo.sh macbuild/cairo-macos

      - name: Cairo cache save
        if: steps.cairo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            macbuild/cairo-macos/include
            macbuild/cairo-macos/lib
          key: ${{ steps.cairo.outputs.cache-primary-key }}

      - name: Configure
        run: >
          cmake -S substrike -B substrike/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DSUBSTRIKE_BUILD_VST3=ON
          -DSUBSTRIKE_BUILD_AUV2=ON
          -DSUBSTRIKE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build substrike/build -- -k 0

      # The wrapper decides where its bundles land on macOS (not where the
      # Linux build puts the VST3), so they are looked up rather than assumed.
      - name: Bundles
        id: bundles
        working-directory: substrike/build
        run: |
          for ext in clap vst3 component; do
            b="$(find . -maxdepth 3 -type d -name "Substrike.${ext}" -not -path '*/CMakeFiles/*' | head -1)"
            [ -n "$b" ] || { echo "no Substrike.${ext} in the build tree"; exit 1; }
            echo "${ext}=$b" | tee -a "$GITHUB_OUTPUT"
            lipo -info "$b/Contents/MacOS/Substrike"
          done

      # The renderer loads the built .clap as a host does and runs the whole
      # self-test through it; the preset check parses every factory preset;
      # gui-snapshot renders the editor offscreen with the Quartz fonts (a PPM:
      # this Cairo has no PNG), turned into a PNG to look at. Settings, user
      # presets and exports go to a scratch folder, never ~/Library. The
      # x86_64 half runs under Rosetta.
      - name: Tests
        working-directory: substrike/build
        run: |
          scratch="$(mktemp -d)"
          export XDG_CONFIG_HOME="$scratch/config" XDG_DATA_HOME="$scratch/data"
          plugin="${{ steps.bundles.outputs.clap }}/Contents/MacOS/Substrike"
          run_tests() {
            $1 ./substrike-render --plugin "$plugin" --selftest
            $1 ./substrike-preset-check
            $1 ./substrike-gui-snapshot "$scratch/editor.ppm"
          }
          lipo -info substrike-render
          echo "--- arm64"
          run_tests ""
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "--- x86_64 (Rosetta)"
            run_tests "arch -x86_64"
          else
            echo "no Rosetta on this runner: x86_64 not run"
          fi
          mkdir -p ../../dist
          python3 - "$scratch/editor.ppm" ../../dist/substrike-editor-macos.png <<'PY'
          import struct, sys, zlib
          data = open(sys.argv[1], 'rb').read()
          parts = data.split(b'\n', 3)
          w, h = map(int, parts[1].split())
          px = parts[3]
          rows = b''.join(b'\x00' + px[y * w * 3:(y + 1) * w * 3] for y in range(h))
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(rows, 9)) + chunk(b'IEND', b'')
          open(sys.argv[2], 'wb').write(png)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: substrike-editor-macos
          path: dist/substrike-editor-macos.png

      - name: Sign (ad hoc)
        working-directory: substrike/build
        run: |
          for b in "${{ steps.bundles.outputs.clap }}" "${{ steps.bundles.outputs.vst3 }}" "${{ steps.bundles.outputs.component }}"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      # Loads the Audio Unit the way Logic does and runs Apple's validation:
      # instantiation, render at several rates, parameters, state.
      - name: Audio Unit validation
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "substrike/build/${{ steps.bundles.outputs.component }}" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i "Rvtr" || true
          auval -v aumu Sbst Rvtr

      - name: Package
        id: package
        run: |
          ver="$(sed -n 's/^project(Substrike VERSION \([0-9.]*\).*/\1/p' substrike/CMakeLists.txt)"
          name="Substrike-${ver}-macOS"
          d="dist/${name}"
          mkdir -p "$d"
          for b in "${{ steps.bundles.outputs.clap }}" "${{ steps.bundles.outputs.vst3 }}" "${{ steps.bundles.outputs.component }}"; do
            cp -R "substrike/build/$b" "$d/"
          done
          cp LICENSE substrike/README.md "$d/"
          cat > "$d/INSTALL.txt" <<EOF
          Substrike ${ver} for macOS (10.15 or later, Apple Silicon and Intel)

          1. Copy the plugin format(s) your DAW uses:

               Substrike.clap       ->  ~/Library/Audio/Plug-Ins/CLAP/
               Substrike.vst3       ->  ~/Library/Audio/Plug-Ins/VST3/
               Substrike.component  ->  ~/Library/Audio/Plug-Ins/Components/

             (~/Library is hidden in the Finder: Go > Go to Folder... and type the path.)

          2. Substrike is free and not notarized by Apple, so macOS blocks files
             downloaded from the internet until you clear their quarantine flag.
             Open Terminal and run:

               xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/CLAP/Substrike.clap
               xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/Substrike.vst3
               xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/Substrike.component

             Without this the DAW does not load the plugin, or reports it as damaged.

          3. Restart the DAW and let it rescan its plugins.

          The factory presets are built into the plugin. Your own presets, the
          settings and the hits you drag out of the window live in
            ~/Library/Application Support/Substrike/
          EOF
          ditto -c -k --keepParent "$d" "dist/${name}.zip"
          echo "zip=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.zip }}" --clobber
